name = "site-ebv"
account_id = "e40e7bc045d3d2b376418903b4492280"
main = "src/worker.js"
compatibility_date = "2026-08-14"
workers_dev = true
preview_urls = false

# As rotas de domínio personalizado são gerenciadas no painel da Cloudflare (Workers > site-ebv > Settings > Domains & Routes)
# routes = [
#   { pattern = "ebvimoveiscuritiba.com.br/*", zone_name = "ebvimoveiscuritiba.com.br" },
#   { pattern = "www.ebvimoveiscuritiba.com.br/*", zone_name = "ebvimoveiscuritiba.com.br" }
# ]

# Create and configure the resources before deploying:
#   npx wrangler d1 create ebv-imoveis
#   npx wrangler r2 bucket create ebv-imoveis-photos
# Replace database_id below with the ID printed by the first command.
# Configure runtime values without committing credentials:
#   ADMIN_PASSWORD   (obrigatório, senha do ADMIN_USERNAME)
#   SESSION_SECRET   (opcional; sem ele a chave de sessão é gerada e guardada no D1)
#   ADMIN2_USERNAME / ADMIN2_PASSWORD (opcional, segundo acesso ao painel)
#   META_PIXEL_ID    (ID do conjunto de dados/Pixel da Meta; liga o Pixel no site)
#   META_CAPI_TOKEN  (token da Conversions API, gerado no Gerenciador de Eventos)
#   META_TEST_EVENT_CODE (opcional, só para testar eventos no Gerenciador de Eventos)
# Sem ADMIN_PASSWORD o painel fica bloqueado (não há senha no código).

[vars]
ADMIN_USERNAME = "contato@ebvimoveiscuritiba.com.br"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/imovel/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ebv-imoveis"
database_id = "ac8e6c10-c9eb-4072-8e41-f9431781dffe"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ebv-imoveis-photos"
